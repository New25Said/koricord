<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KoriCord</title>

<style>
body{
margin:0;
font-family:Arial;
background:#313338;
color:white;
display:flex;
height:100vh;
}

/* 🔐 LOGIN */
#login{
position:fixed;
inset:0;
background:#1e1f22;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:10px;
z-index:999;
}

#login input{
padding:10px;
border:none;
border-radius:6px;
background:#2b2d31;
color:white;
}

#login button{
padding:10px;
border:none;
border-radius:6px;
background:#5865f2;
color:white;
cursor:pointer;
}

.sidebar{
width:240px;
background:#2b2d31;
padding:12px;
border-right:1px solid #1f2023;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
display:flex;
gap:10px;
padding:8px;
border-radius:8px;
}

.msg:hover{ background:#2b2d31; }

.avatar{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
background:#5865f2;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.content{ display:flex; flex-direction:column; }

.top{ display:flex; gap:8px; align-items:center; }

.name{ font-weight:bold; }

.time{ font-size:11px; color:#a1a1a1; }

.text{ color:#dcddde; margin-top:2px; }

.input{
padding:12px;
background:#2b2d31;
display:flex;
gap:10px;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:6px;
background:#1e1f22;
color:white;
}

button{
padding:10px;
border:none;
border-radius:6px;
background:#5865f2;
color:white;
cursor:pointer;
}

/* ✍️ typing */
#typing{
font-size:12px;
color:#a1a1a1;
padding-left:16px;
height:18px;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="login">
<h2>¿Eres Kori?</h2>
<input id="pass" placeholder="escribe: soykori">
<button onclick="checkLogin()">Entrar</button>
<p id="err"></p>
</div>

<div class="sidebar">
<h2>KoriCord</h2>
<div>2PyM</div>
<div>🌐 Web ↔ Discord</div>
</div>

<div class="chat">

<div id="messages" class="messages"></div>
<div id="typing"></div>

<div class="input">
<input id="msg" placeholder="Escribe a Discord...">
<button onclick="sendMessage()">Enviar</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
getDatabase,
ref,
push,
onChildAdded,
set,
remove
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyARq5j8Kf9p4SYj4sj3167BjVD-Q4KczQE",
authDomain: "koricord-a5f4e.firebaseapp.com",
databaseURL: "https://koricord-a5f4e-default-rtdb.firebaseio.com",
projectId: "koricord-a5f4e",
storageBucket: "koricord-a5f4e.firebasestorage.app",
messagingSenderId: "228519016518",
appId: "1:228519016518:web:9062449c2b5135ee36b247"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🔐 LOGIN */
window.checkLogin = function(){
const val = document.getElementById("pass").value;
if(val === "soykori"){
document.getElementById("login").style.display="none";
}else{
document.getElementById("err").innerText="Esto es solo para Kori, intenta otra vez";
}
};

/* 🌐 SEND */
window.sendMessage = async function(){
const text = document.getElementById("msg").value;
if(!text) return;

await push(ref(db,"messages"), {
source:"web",
text,
timestamp: Date.now()
});

document.getElementById("msg").value="";
};

/* 💬 LOAD + ORDER FIX */
const allMessages = [];

function render(){
const box = document.getElementById("messages");
box.innerHTML="";

allMessages
.sort((a,b)=>a.timestamp-b.timestamp)
.forEach(data=>{

const div = document.createElement("div");
div.className="msg";

const time = new Date(data.timestamp)
.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

div.innerHTML = `
${
data.avatar
? `<img class="avatar" src="${data.avatar}">`
: `<div class="avatar">B</div>`
}

<div class="content">
<div class="top">
<span class="name">${data.nickname || data.username || "Web"}</span>
<span class="time">${time}</span>
</div>

<div class="text">${data.text}</div>
</div>
`;

box.appendChild(div);
});
}

/* 🔥 FIREBASE LISTENER */
onChildAdded(ref(db,"messages"), (snap)=>{
const data = snap.val();
allMessages.push(data);
render();
});

/* ✍️ typing indicator */
let typingTimeout;

document.getElementById("msg").addEventListener("input", ()=>{
set(ref(db,"typing/web"), true);

clearTimeout(typingTimeout);
typingTimeout = setTimeout(()=>{
remove(ref(db,"typing/web"));
},1000);
});

onChildAdded(ref(db,"typing"), ()=>{
document.getElementById("typing").innerText="Alguien está escribiendo...";
});

/* ENTER */
document.getElementById("msg").addEventListener("keydown",(e)=>{
if(e.key==="Enter") sendMessage();
});

</script>

</body>
</html>
