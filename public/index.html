<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoriCord Futurist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h3>¿Eres Kori?</h3> [cite: 19]
      <input id="loginInput" type="password" placeholder="Escribe la clave secreta...">
      <button onclick="checkLogin()">Entrar</button> [cite: 14]
      <div id="errorMsg" class="error-msg">Esto es solo para kori, intenta otra vez</div> [cite: 20]
    </div>
  </div>

  <div class="app-container">
    
    <div class="guilds-sidebar">
      <div class="guild-icon-wrap" id="guildWrapper">
        <div class="guild-icon" id="guildIcon">K</div>
        <span class="guild-tooltip" id="guildTooltip">Cargando servidor...</span>
      </div>
    </div>

    <div class="sidebar"> [cite: 8]
      <div class="sidebar-header">
        <h2 id="serverTitle">KoriCord</h2> [cite: 8]
        <div class="sub">2PyM 🌐</div> [cite: 8]
      </div>
      <div class="channels-list" id="channelsList">
        </div>
    </div>

    <div class="chat"> [cite: 8]
      <div class="chat-header">
        <span class="hashtag">#</span>
        <span id="currentChannelName">general</span>
      </div>
      
      <div id="messages" class="messages"></div> [cite: 8]
      
      <div id="typing" class="typing-indicator"></div>
      
      <div class="input"> [cite: 10]
        <input id="msg" placeholder="Escribe a Discord..."> [cite: 10]
        <button onclick="sendMessage()">Enviar</button> [cite: 10]
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
