<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KoriCord</title>

<style>
/* Paleta de Colores un pelín más oscura estilo AMOLED / Discord Dark */
body{margin:0;font-family:Arial, sans-serif;background:#111214;color:white;height:100vh;overflow:hidden;}
#login{position:fixed;inset:0;background:#1e1f22;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:200;}
input,button{padding:10px;border-radius:6px;border:none;outline:none;transition: all 0.2s ease;}
button{background:#5865f2;color:white;cursor:pointer;font-weight:bold;}
button:hover{background:#4752c4; transform: scale(1.03);}

/* Estructura de 4 Columnas estilo Discord */
.app-container{display:none;height:100vh;width:100vw;}

/* COLUMNA 1: Lista de Servidores con Animaciones */
.guilds-sidebar{width:72px;background:#1e1f22;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;border-right:1px solid #111214;overflow-y:auto;flex-shrink:0;}
.guild-icon{width:48px;height:48px;border-radius:50%;background:#313338;color:#dbdee1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1);overflow:hidden;position:relative;}
.guild-icon img{width:100%;height:100%;object-fit:cover;transition: transform 0.25s ease;}
.guild-icon:hover img{transform: scale(1.1);}
.guild-icon:hover, .guild-icon.active{border-radius:16px;background:#5865f2;color:white;}
.guild-separator{width:32px;height:2px;background:#2b2d31;margin:4px 0;border-radius:1px;}

.dm-icon-svg {width:26px; height:26px; fill:currentColor; transition: transform 0.25s ease;}
.guild-icon:hover .dm-icon-svg {transform: rotate(8deg) scale(1.1);}

.guild-badge {position:absolute;bottom:0;right:0;width:14px;height:14px;background:#f23f43;border-radius:50%;border:2px solid #1e1f22;display:none;animation: popBadge 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
.guild-icon.unread .guild-badge {display:block;}

/* COLUMNA 2: Lista de Canales */
.channels-sidebar{width:220px;background:#2b2d31;display:flex;flex-direction:column;padding:16px 8px;gap:4px;border-right:1px solid #1c1d1f;overflow-y:auto;flex-shrink:0;}
.sidebar-title{font-size:12px;font-weight:bold;color:#949ba4;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.channel-btn{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:4px;color:#949ba4;cursor:pointer;font-size:14px;font-weight:500;position:relative;transition: all 0.2s ease;}
.channel-btn:hover{background:#35373c;color:#dbdee1;padding-left:12px;}
.channel-btn.active{background:#404249;color:white;padding-left:12px;}
.channel-name-wrapper{display:flex;align-items:center;gap:6px;}

.is-channel .channel-name-wrapper::before{content:"#";font-size:18px;color:#80848e;margin-right:2px;}
.is-dm .channel-name-wrapper::before{content:"👤";font-size:14px;margin-right:4px;}

.channel-badge {width:8px;height:8px;background:#ffffff;border-radius:50%;display:none;animation: popBadge 0.2s ease;}
.channel-btn.unread .channel-badge {display:block;}

/* COLUMNA 3: Área Central de Chat (Más Oscura) */
.chat-area{flex:1;display:flex;flex-direction:column;height:100vh;background:#313338;position:relative;min-width:0;}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;}

/* COLUMNA 4: Barra Derecha de Miembros */
.member-list{width:240px;background:#2b2d31;display:flex;flex-direction:column;padding:16px 8px;gap:8px;border-left:1px solid #1c1d1f;overflow-y:auto;flex-shrink:0;}
.member-title{font-size:12px;font-weight:bold;color:#949ba4;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;padding-left:8px;}

/* Componentes de Usuario y Avatares */
.avatar-container{position:relative;width:38px;height:38px;flex-shrink:0;}
.avatar{width:38px;height:38px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:bold;}
.avatar img{width:100%;height:100%;object-fit:cover;}

.status-dot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;border:3px solid #2b2d31;transition: all 0.2s ease;}
.status-online{background:#23a55a;}
.status-idle{background:#f0b232; border-radius: 50% 0 50% 50%; transform: rotate(-45deg); width: 10px; height: 10px; bottom: 0px; right: 0px;}
.status-dnd{background:#f23f43;}
.status-dnd::after{content:""; position:absolute; width:6px; height:2px; background:#2b2d31; top:50%; left:50%; transform:translate(-50%, -50%);}
.status-offline{background:#80848e;}

.member-card{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;cursor:pointer;transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);}
.member-card:hover{background:#35373c;transform: translateX(4px);}
.user-info{display:flex;flex-direction:column;min-width:0;flex:1;}
.member-nick{font-weight:500;font-size:14px;color:#f2f3f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-user{font-size:11px;color:#949ba4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-activity{font-size:11px;color:#b5bac1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-style:italic;}

/* Estilos e Intro Fluida de Mensajes */
.msg{display:flex;gap:16px;padding:8px;border-radius:4px;animation: fadeInMsg 0.25s ease-out both;}
.msg:hover{background:#2e3035;}
.msg-content{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.top{display:flex;align-items:baseline;gap:8px;}
.name{font-weight:bold;color:#f2f3f5;font-size:15px;}
.sub-user{font-size:11px;color:#949ba4;}
.time{font-size:11px;color:#949ba4;}
.text{color:#dbdee1;font-size:15px;word-break:break-word;line-height:1.4;}

.text code {background:#1e1f22; padding:2px 4px; border-radius:4px; font-family:monospace; font-size:14px; color:#e0c89a;}
.media-attachment{margin-top:8px;max-width:400px;max-height:300px;border-radius:8px;overflow:hidden;display:block;}
.media-attachment img, .media-attachment video{max-width:100%;max-height:300px;border-radius:8px;transition: transform 0.2s ease;}
.media-attachment img:hover{transform: scale(1.02);}

/* Input */
.input-box{padding:0 16px 24px 16px;background:#313338;position:relative;}
.input-box input{width:100%;background:#383a40;color:#dbdee1;padding:12px;box-sizing:border-box;font-size:15px;border-radius:8px;border:none;}
.typing-indicator{position:absolute;top:-18px;left:20px;font-size:12px;color:#abcdef;height:14px;}

/* Modal de Perfil Detallado Animado */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:250;align-items:center;justify-content:center;backdrop-filter: blur(2px);transition: all 0.3s ease;}
.profile-modal{width:300px;background:#18191c;border-radius:8px;overflow:hidden;box-shadow:0 12px 24px rgba(0,0,0,0.6);animation: scaleUpModal 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;}
.profile-banner{height:60px;background:#5865f2;}
.profile-header{padding:0 16px 16px 16px;position:relative;border-bottom:1px solid #232428;}
.profile-modal-avatar{width:80px;height:80px;border-radius:50%;border:6px solid #18191c;background:#5865f2;overflow:hidden;position:absolute;top:-40px;left:16px;}
.profile-modal-avatar img{width:100%;height:100%;object-fit:cover;}

.profile-names{margin-top: 52px;} 
.profile-nick{font-size:20px;font-weight:bold;color:white;word-break:break-all;}
.profile-user{font-size:14px;color:#b5bac1;margin-top:2px;}
.profile-body{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13px;}
.profile-section-title{font-size:11px;font-weight:bold;color:#949ba4;text-transform:uppercase;letter-spacing:0.5px;}
.profile-roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.role-badge{background:#2b2d31;color:#dbdee1;padding:4px 8px;border-radius:4px;font-size:12px;border:1px solid #35373c;}

/* Keyframes de Animaciones */
@keyframes fadeInMsg {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleUpModal {
  from { transform: scale(0.9) translateY(10px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
@keyframes popBadge {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div id="login">
<h2>¿Eres Kori?</h2>
<input id="code" type="password" placeholder="escribe: soykori">
<button onclick="check()">Entrar</button>
<p id="err" style="color:#fa777c; font-size:14px;"></p>
</div>

<div class="app-container" id="app">
  <!-- COLUMNA 1: SELECTOR DE SERVIDORES Y BOTÓN DM -->
  <div class="guilds-sidebar">
    <div class="guild-icon active" id="dmServerBtn" title="Mensajes Directos" onclick="selectDMMode()">
      <svg class="dm-icon-svg" viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.43-5c.56-.41,1.11-.84,1.64-1.28A75.48,75.48,0,0,0,100,79.24c.53.44,1.08.87,1.64,1.28a68.43,68.43,0,0,1-10.43,5A77.7,77.7,0,0,0,97.83,96.36a105.73,105.73,0,0,0,31-18.83C130,50.12,123.83,27.23,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
      </svg>
      <div class="guild-badge"></div>
    </div>
    <div class="guild-separator"></div>
    <div id="guildsContainer" style="display:contents;"></div>
  </div>

  <!-- COLUMNA 2: SELECTOR DE CANALES / CONVERSACIONES DM -->
  <div class="channels-sidebar">
    <div class="sidebar-title" id="currentGuildName">Mensajes Directos</div>
    <div id="channels-container"></div>
  </div>

  <!-- COLUMNA 3: FLUJO DE CHAT -->
  <div class="chat-area">
    <div id="messages" class="messages"></div>
    <div class="input-box">
      <div id="typing" class="typing-indicator"></div>
      <input id="msg" placeholder="Enviar mensaje..." />
    </div>
  </div>
  
  <!-- COLUMNA 4: LISTA DE MIEMBROS -->
  <div class="member-list">
    <div class="member-title" id="membersTitle">Tus Contactos</div>
    <div id="members-container"></div>
  </div>
</div>

<!-- MODAL DE PERFIL DETALLADO -->
<div class="modal-overlay" id="profileModal" onclick="closeProfile()">
  <div class="profile-modal" onclick="event.stopPropagation()">
    <div class="profile-banner"></div>
    <div class="profile-header">
      <div class="profile-modal-avatar" id="modalAvatar"></div>
      <div class="profile-names">
        <div class="profile-nick" id="modalNick">-</div>
        <div class="profile-user" id="modalUser">@unknown</div>
      </div>
    </div>
    <div class="profile-body">
      <div>
        <div class="profile-section-title">Actividad Actual</div>
        <div style="color:#dbdee1; margin-top:4px;" id="modalActivity">Ninguna</div>
      </div>
      <div>
        <div class="profile-section-title">Miembro Desde</div>
        <div style="color:#dbdee1; margin-top:4px;" id="modalJoined">-</div>
      </div>
      <div>
        <div class="profile-section-title">Roles</div>
        <div class="profile-roles" id="modalRoles">Ninguno</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyARq5j8Kf9p4SYj4sj3167BjVD-Q4KczQE",
authDomain:"koricord-a5f4e.firebaseapp.com",
databaseURL:"https://koricord-a5f4e-default-rtdb.firebaseio.com",
projectId:"koricord-a5f4e",
storageBucket:"koricord-a5f4e.appspot.com",
messagingSenderId:"228519016518",
appId:"1:228519016518:web:9062449c2b5135ee36b247"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let messages = [];
let cacheUsers = {};
let isDMMode = true; 
let currentGuildId = "DM"; 
let currentChannelId = "";
let unreadCount = 0;
let isTabFocused = true;

let unreadChannels = {};
let unreadGuilds = {};

window.addEventListener('focus', () => { isTabFocused = true; unreadCount = 0; document.title = "KoriCord"; });
window.addEventListener('blur', () => { isTabFocused = false; });

function escapeHTML(text) {
  if(!text) return "";
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function parseMarkdown(text) {
  let html = escapeHTML(text)
    .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')           
    .replace(/__([\s\S]+?)__/g, '<u>$1</u>')                           
    .replace(/\*([\s\S]+?)\*/g, '<em>$1</em>')                         
    .replace(/~~([\s\S]+?)~~/g, '<del>$1</del>')                       
    .replace(/`([^`]+)`/g, '<code>$1</code>');                        
  return html;
}

window.check = () => {
  const val = document.getElementById("code").value;
  if(val === "soykori"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="flex";
  }else{
    document.getElementById("err").innerText="Esto es solo para Kori. Intenta otra vez.";
  }
};

function renderMessages(){
  const box = document.getElementById("messages");
  box.innerHTML = "";
  
  const filtered = messages.filter(m => m.channelId === currentChannelId);
  filtered.sort((a,b)=>a.timestamp-b.timestamp);

  for(const m of filtered){
    const div = document.createElement("div");
    div.className="msg";
    const avatarHtml = m.avatar ? `<img src="${m.avatar}">` : (m.nickname || "K")[0];
    
    let attachmentHtml = "";
    if(m.attachments){
      for(const att of m.attachments){
        if(att.type === "image") attachmentHtml += `<div class="media-attachment"><img src="${att.url}"></div>`;
        if(att.type === "video") attachmentHtml += `<div class="media-attachment"><video src="${att.url}" controls></video></div>`;
      }
    }

    div.innerHTML = `
    <div class="avatar-container"><div class="avatar">${avatarHtml}</div></div>
    <div class="msg-content">
      <div class="top">
        <span class="name">${m.nickname || m.username}</span>
        <span class="sub-user">@${m.username || 'kori'}</span>
        <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
      </div>
      <div class="text">${parseMarkdown(m.text)}</div>
      ${attachmentHtml}
    </div>`;
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
}

window.selectDMMode = () => {
  isDMMode = true;
  currentGuildId = "DM";
  currentChannelId = "";
  
  document.querySelectorAll('.guild-icon').forEach(i => i.classList.remove('active'));
  document.getElementById("dmServerBtn").classList.add('active');
  
  loadChannelsAndMembers();
};

onValue(ref(db, "guilds"), snap => {
  const container = document.getElementById("guildsContainer");
  container.innerHTML = "";
  const guilds = snap.val();
  if(!guilds) return;

  Object.values(guilds).forEach(g => {
    const iconBtn = document.createElement("div");
    iconBtn.id = `guild-node-${g.id}`;
    iconBtn.className = `guild-icon ${(!isDMMode && g.id === currentGuildId) ? 'active' : ''} ${unreadGuilds[g.id] ? 'unread' : ''}`;
    iconBtn.title = g.name;
    
    if(g.iconUrl) {
      iconBtn.innerHTML = `<img src="${g.iconUrl}" alt="${g.name}"><div class="guild-badge"></div>`;
    } else {
      iconBtn.innerHTML = `${g.name.split(" ").map(w => w[0]).join("").substring(0,3)}<div class="guild-badge"></div>`;
    }

    iconBtn.onclick = () => {
      isDMMode = false;
      currentGuildId = g.id;
      unreadGuilds[g.id] = false;
      iconBtn.classList.remove('unread');
      document.querySelectorAll('.guild-icon').forEach(i => i.classList.remove('active'));
      iconBtn.classList.add('active');
      currentChannelId = ""; 
      loadChannelsAndMembers();
    };
    container.appendChild(iconBtn);
  });
  
  loadChannelsAndMembers();
});

function loadChannelsAndMembers() {
  const channelContainer = document.getElementById("channels-container");
  channelContainer.innerHTML = "";

  if (isDMMode) {
    document.getElementById("currentGuildName").innerText = "Mensajes Directos";
    document.getElementById("membersTitle").innerText = "Tus Contactos";

    onValue(ref(db, "dmChannels"), snap => {
      channelContainer.innerHTML = "";
      const dms = snap.val();
      if(!dms) return;

      const list = Object.values(dms);
      if(!currentChannelId && list.length > 0) currentChannelId = list[0].id;

      list.forEach(dm => {
        const btn = document.createElement("div");
        btn.id = `channel-node-${dm.id}`;
        btn.className = `channel-btn is-dm ${dm.id === currentChannelId ? 'active' : ''} ${unreadChannels[dm.id] ? 'unread' : ''}`;
        btn.innerHTML = `<div class="channel-name-wrapper">${dm.name}</div><div class="channel-badge"></div>`;
        btn.onclick = () => {
          currentChannelId = dm.id;
          unreadChannels[dm.id] = false;
          btn.classList.remove('unread');
          document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderMessages();
        };
        channelContainer.appendChild(btn);
      });
      renderMessages();
    });

    onValue(ref(db, "dmChannels"), snap => {
      const memberContainer = document.getElementById("members-container");
      memberContainer.innerHTML = "";
      const dms = snap.val();
      if(!dms) return;
      cacheUsers = dms;

      Object.values(dms).forEach(u => {
        const card = document.createElement("div");
        card.className = "member-card";
        card.onclick = () => openProfile(u.id);
        const userAvatar = u.avatar ? `<img src="${u.avatar}">` : u.name[0];

        card.innerHTML = `
          <div class="avatar-container"><div class="avatar">${userAvatar}</div></div>
          <div class="user-info">
            <span class="member-nick">${u.name}</span>
            <span class="member-user">@dm_chat</span>
          </div>`;
        memberContainer.appendChild(card);
      });
    });

  } else {
    document.getElementById("membersTitle").innerText = "Miembros";
    onValue(ref(db, `guilds/${currentGuildId}`), gSnap => {
      const g = gSnap.val();
      if(g) document.getElementById("currentGuildName").innerText = g.name;
    });

    onValue(ref(db, `channels/${currentGuildId}`), snap => {
      channelContainer.innerHTML = "";
      const channels = snap.val();
      if(!channels) return;

      const list = Object.values(channels);
      if(!currentChannelId && list.length > 0) currentChannelId = list[0].id;

      list.forEach(ch => {
        const btn = document.createElement("div");
        btn.id = `channel-node-${ch.id}`;
        btn.className = `channel-btn is-channel ${ch.id === currentChannelId ? 'active' : ''} ${unreadChannels[ch.id] ? 'unread' : ''}`;
        btn.innerHTML = `<div class="channel-name-wrapper">${ch.name}</div><div class="channel-badge"></div>`;
        btn.onclick = () => {
          currentChannelId = ch.id;
          unreadChannels[ch.id] = false;
          btn.classList.remove('unread');
          document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderMessages();
        };
        channelContainer.appendChild(btn);
      });
      renderMessages();
    });

    onValue(ref(db, `usersStatus/${currentGuildId}`), snap => {
      const container = document.getElementById("members-container");
      container.innerHTML = "";
      const users = snap.val();
      if(!users) return;
      cacheUsers = users;

      const sortedUsers = Object.values(users).sort((a,b) => (b.status !== "offline") - (a.status !== "offline"));
      for(const u of sortedUsers){
        const card = document.createElement("div");
        card.className = "member-card";
        card.onclick = () => openProfile(u.uid);
        
        const userAvatar = u.avatar ? `<img src="${u.avatar}">` : u.nickname[0];
        let statusClass = "status-offline";
        if(u.status === "online") statusClass = "status-online";
        if(u.status === "idle") statusClass = "status-idle";
        if(u.status === "dnd") statusClass = "status-dnd";

        let activityHtml = u.status !== "offline" && u.activity ? `<span class="member-activity">${u.activity}</span>` : "";

        card.innerHTML = `
          <div class="avatar-container">
            <div class="avatar">${userAvatar}</div>
            <div class="status-dot ${statusClass}"></div>
          </div>
          <div class="user-info">
            <span class="member-nick">${u.nickname}</span>
            <span class="member-user">@${u.username}</span>
            ${activityHtml}
          </div>`;
        container.appendChild(card);
      }
    });
  }
}

onChildAdded(ref(db,"discordMessages"), snap=>{
  const msg = snap.val();
  messages.push(msg);
  
  if(msg.channelId !== currentChannelId) {
    unreadChannels[msg.channelId] = true;
    const chNode = document.getElementById(`channel-node-${msg.channelId}`);
    if(chNode) chNode.classList.add('unread');
    
    if(msg.guildId && msg.guildId !== "DM" && msg.guildId !== currentGuildId) {
      unreadGuilds[msg.guildId] = true;
      const gNode = document.getElementById(`guild-node-${msg.guildId}`);
      if(gNode) gNode.classList.add('unread');
    } else if (msg.guildId === "DM" && !isDMMode) {
      document.getElementById("dmServerBtn").classList.add('unread');
    }
  }

  renderMessages();
});

onChildAdded(ref(db,"webMessages"), snap=>{
  const data = snap.val();
  messages.push({
    text: data.text,
    nickname: "Kori",
    username: "soykori",
    timestamp: data.time,
    channelId: data.channelId
  });
  renderMessages();
});

window.openProfile = (uid) => {
  const u = cacheUsers[uid];
  if(!u) return;
  document.getElementById("modalAvatar").innerHTML = u.avatar ? `<img src="${u.avatar}">` : (u.nickname || u.name)[0];
  document.getElementById("modalNick").innerText = u.nickname || u.name;
  document.getElementById("modalUser").innerText = "@" + (u.username || "privado");
  document.getElementById("modalActivity").innerText = u.activity || "Ninguna";
  document.getElementById("modalJoined").innerText = u.joinedAt ? new Date(u.joinedAt).toLocaleDateString() : "Desconocido";
  
  const rolesBox = document.getElementById("modalRoles");
  rolesBox.innerHTML = "";
  if(u.roles && u.roles.length > 0){
    u.roles.forEach(r => {
      const badge = document.createElement("span");
      badge.className = "role-badge";
      badge.innerText = r;
      rolesBox.appendChild(badge);
    });
  } else { rolesBox.innerText = "Ninguno"; }
  
  const modal = document.getElementById("profileModal");
  modal.style.display = "flex";
};

window.closeProfile = () => { document.getElementById("profileModal").style.display = "none"; };

window.sendMessage = async function(){
  const text = document.getElementById("msg").value;
  if(!text.trim() || !currentChannelId) return;

  await push(ref(db,"webMessages"),{
    text: text,
    time: Date.now(),
    channelId: currentChannelId
  });
  document.getElementById("msg").value="";
};

document.getElementById("msg").addEventListener("keydown",(e)=>{ if(e.key==="Enter") sendMessage(); });
</script>
</body>
