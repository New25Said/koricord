<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoriCord</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login">
    <h2>¿Eres Kori?</h2>
    <input id="code" type="password" placeholder="escribe: soykori">
    <button id="loginBtn">Entrar</button>
    <p id="err"></p>
  </div>

  <!-- CONTENEDOR PRINCIPAL DISCORD -->
  <div class="app-container" id="app">
    
    <!-- COLUMNA 1: BARRA DE SERVIDORES -->
    <div class="guilds-sidebar">
      <div class="guild-icon" id="dmServerBtn" title="Mensajes Directos">
        <svg class="dm-icon-svg" viewBox="0 0 127.14 96.36">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.43-5c.56-.41,1.11-.84,1.64-1.28A75.48,75.48,0,0,0,100,79.24c.53.44,1.08.87,1.64,1.28a68.43,68.43,0,0,1-10.43,5A77.7,77.7,0,0,0,97.83,96.36a105.73,105.73,0,0,0,31-18.83C130,50.12,123.83,27.23,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
        </svg>
        <div class="guild-badge"></div>
      </div>
      <div class="guild-separator"></div>
      <div id="guildsContainer" style="display:contents;"></div>
    </div>

    <!-- COLUMNA 2: CANALES / LISTA DM NATIVA -->
    <div class="channels-sidebar">
      <div class="sidebar-title" id="currentGuildName">Mensajes Directos</div>
      <div class="channel-list-scroller" id="channels-container"></div>
    </div>

    <!-- COLUMNA 3: FLUJO DE CHAT CENTRAL -->
    <div class="chat-area" id="chatArea">
      <div class="dm-placeholder" id="placeholderView">
        <h3>Activo ahora</h3>
        <p>Por ahora está todo tranquilo... Elige una conversación para empezar.</p>
      </div>
      <div id="mainChatContent" style="display:none; flex:1; flex-direction:column;">
        <div id="messages" class="messages"></div>
        <div class="input-box">
          <div id="typing" class="typing-indicator"></div>
          <input id="msg" placeholder="Enviar mensaje..." autocomplete="off" />
        </div>
      </div>
    </div>

    <!-- COLUMNA 4: BARRA DERECHA DINÁMICA -->
    <div class="member-list" id="sidebarRightColumn"></div>

  </div>

  <!-- MODAL DE PERFIL COMPLETO -->
  <div class="modal-overlay" id="profileModal">
    <div class="profile-modal">
      <div class="profile-banner"></div>
      <div class="profile-header">
        <div class="profile-modal-avatar" id="modalAvatar"></div>
        <div class="profile-names">
          <div class="profile-nick" id="modalNick">-</div>
          <div class="profile-user" id="modalUser">@unknown</div>
        </div>
      </div>
      <div class="profile-body">
        <div>
          <div class="profile-section-title">Estado del Usuario</div>
          <div style="color:#dbdee1; margin-top:4px;" id="modalStatusText">Desconectado</div>
        </div>
        <div>
          <div class="profile-section-title">Actividad Actual</div>
          <div style="color:#dbdee1; margin-top:4px;" id="modalActivity">Ninguna</div>
        </div>
        <div>
          <div class="profile-section-title">Miembro Desde</div>
          <div style="color:#dbdee1; margin-top:4px;" id="modalJoined">-</div>
        </div>
        <div>
          <div class="profile-section-title">Roles</div>
          <div class="profile-roles" id="modalRoles">Ninguno</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Motor de la Aplicación -->
  <script type="module" src="app.js"></script>
</body>
</html>
