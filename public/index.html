<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KoriCord</title>

<style>
body{
margin:0;
font-family:Arial;
background:#313338;
color:white;
display:flex;
height:100vh;
}

.sidebar{
width:240px;
background:#2b2d31;
padding:12px;
border-right:1px solid #1f2023;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
display:flex;
gap:10px;
padding:8px;
border-radius:8px;
}

.msg:hover{
background:#2b2d31;
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
background:#5865f2;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
flex-shrink:0;
}

.content{
display:flex;
flex-direction:column;
}

.top{
display:flex;
gap:8px;
align-items:center;
}

.name{
font-weight:bold;
}

.username{
font-size:12px;
color:#949ba4;
margin-top:2px;
margin-bottom:4px;
}

.time{
font-size:11px;
color:#a1a1a1;
}

.text{
color:#dcddde;
margin-top:2px;
}

.input{
padding:12px;
background:#2b2d31;
display:flex;
gap:10px;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:6px;
background:#1e1f22;
color:white;
}

button{
padding:10px;
border:none;
border-radius:6px;
background:#5865f2;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>KoriCord</h2>
<div>2PyM</div>
<div>🌐 Web ↔ Discord :D</div>
</div>

<div class="chat">

<div id="messages" class="messages"></div>

<div class="input">
<input id="msg" placeholder="Escribe a Discord...">
<button onclick="sendMessage()">Enviar</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
getDatabase,
ref,
push,
onChildAdded
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyARq5j8Kf9p4SYj4sj3167BjVD-Q4KczQE",
authDomain: "koricord-a5f4e.firebaseapp.com",
databaseURL: "https://koricord-a5f4e-default-rtdb.firebaseio.com",
projectId: "koricord-a5f4e",
storageBucket: "koricord-a5f4e.firebasestorage.app",
messagingSenderId: "228519016518",
appId: "1:228519016518:web:9062449c2b5135ee36b247"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🌐 ENVIAR A FIREBASE */
window.sendMessage = async function(){

const text = document.getElementById("msg").value;
if(!text) return;

await push(ref(db,"webMessages"), {
text: text,
time: Date.now()
});

document.getElementById("msg").value="";
};

/* 💬 DISCORD → WEB */
onChildAdded(ref(db,"discordMessages"), (snap) => {

const data = snap.val();

const div = document.createElement("div");
div.className = "msg";

const time = new Date(data.timestamp)
.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

div.innerHTML = `
${
data.avatar
? `<img class="avatar" src="${data.avatar}">`
: `<div class="avatar">${(data.nickname || "?")[0].toUpperCase()}</div>`
}

<div class="content">

<div class="top">
<span class="name">${data.nickname || data.username}</span>
<span class="time">${time}</span>
</div>

<div class="username">
@${data.username}
</div>

<div class="text">${data.text}</div>

</div>
`;

document.getElementById("messages").appendChild(div);

document.getElementById("messages").scrollTop =
document.getElementById("messages").scrollHeight;

});

/* 💬 ENTER PARA ENVIAR */
document.getElementById("msg").addEventListener("keydown", (e) => {
if (e.key === "Enter") sendMessage();
});

/* 💬 MENSAJES ENVIADOS DESDE LA WEB */
onChildAdded(ref(db,"webMessages"), (snap) => {

const data = snap.val();

const div = document.createElement("div");
div.className = "msg";

const time = new Date(data.time)
.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

div.innerHTML = `
<div class="avatar">U</div>

<div class="content">
<div class="top">
<span class="name">Tú</span>
<span class="time">${time}</span>
</div>

<div class="text">${data.text}</div>
</div>
`;

document.getElementById("messages").appendChild(div);

document.getElementById("messages").scrollTop =
document.getElementById("messages").scrollHeight;

});

</script>

</body>
</html>
