<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KoriCord</title>

<style>
body{margin:0;font-family:Arial, sans-serif;background:#313338;color:white;height:100vh;overflow:hidden;}
#login{position:fixed;inset:0;background:#1e1f22;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10;}
input,button{padding:10px;border-radius:6px;border:none;outline:none;}
button{background:#5865f2;color:white;cursor:pointer;font-weight:bold;}
button:hover{background:#4752c4;}

/* Estructura Principal tipo Discord */
.app-container{display:none;height:100vh;width:100vw;}
.chat-area{flex:1;display:flex;flex-direction:column;height:100vh;background:#313338;position:relative;}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;}

/* Barra Lateral de Usuarios */
.member-list{width:240px;background:#2b2d31;display:flex;flex-direction:column;padding:16px 8px;gap:8px;border-left:1px solid #3f4147;overflow-y:auto;}
.member-title{font-size:12px;font-weight:bold;color:#949ba4;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;padding-left:8px;}
.member-card{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;cursor:default;}
.member-card:hover{background:#35373c;}

/* Componentes de Usuario y Avatares */
.avatar-container{position:relative;width:38px;height:38px;flex-shrink:0;}
.avatar{width:38px;height:38px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}

/* Indicadores de Estado Detallados de Discord */
.status-dot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;border:3px solid #2b2d31;}
.status-online{background:#23a55a;}
.status-idle{background:#f0b232; border-radius: 50% 0 50% 50%; transform: rotate(-45deg); width: 10px; height: 10px; bottom: 0px; right: 0px;} /* Efecto luna creciente */
.status-dnd{background:#f23f43; position: relative;}
.status-dnd::after{content:""; position:absolute; width:6px; height:2px; background:#2b2d31; top:50%; left:50%; transform:translate(-50%, -50%);} /* Guion de No Molestar */
.status-offline{background:#80848e;}

/* Detalles de Texto de Usuarios y Actividad */
.user-info{display:flex;flex-direction:column;min-width:0;flex:1;}
.member-nick{font-weight:500;font-size:14px;color:#f2f3f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-user{font-size:11px;color:#949ba4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-activity{font-size:11px;color:#b5bac1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-style:italic;}

/* Estilos de Mensajes */
.msg{display:flex;gap:16px;padding:8px;border-radius:4px;}
.msg:hover{background:#2e3035;}
.msg-content{display:flex;flex-direction:column;gap:2px;flex:1;}
.top{display:flex;align-items:baseline;gap:8px;}
.name{font-weight:bold;color:#f2f3f5;font-size:15px;}
.sub-user{font-size:11px;color:#949ba4;}
.time{font-size:11px;color:#949ba4;}
.text{color:#dbdee1;font-size:15px;word-break:break-word;}

/* Adjuntos Multimedia */
.media-attachment{margin-top:8px;max-width:400px;max-height:300px;border-radius:8px;overflow:hidden;display:block;}
.media-attachment img, .media-attachment video{max-width:100%;max-height:300px;border-radius:8px;}

/* Input de Chat y Zona de Typing */
.input-box{padding:0 16px 24px 16px;background:#313338;position:relative;}
.input-box input{width:100%;background:#383a40;color:#dbdee1;padding:12px;box-sizing:border-box;font-size:15px;border-radius:8px;}
.typing-indicator{position:absolute;top:-18px;left:20px;font-size:12px;color:#abcdef;height:14px;animation:pulse 1.5s infinite;}

@keyframes pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
</style>
</head>

<body>

<div id="login">
<h2>¿Eres Kori?</h2>
<input id="code" type="password" placeholder="escribe: soykori">
<button onclick="check()">Entrar</button>
<p id="err" style="color:#fa777c; font-size:14px;"></p>
</div>

<div class="app-container" id="app">
  <div class="chat-area">
    <div id="messages" class="messages"></div>
    <div class="input-box">
      <div id="typing" class="typing-indicator"></div>
      <input id="msg" placeholder="Enviar mensaje..." />
    </div>
  </div>
  
  <div class="member-list" id="memberList">
    <div class="member-title">Miembros</div>
    <div id="members-container"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyARq5j8Kf9p4SYj4sj3167BjVD-Q4KczQE",
authDomain:"koricord-a5f4e.firebaseapp.com",
databaseURL:"https://koricord-a5f4e-default-rtdb.firebaseio.com",
projectId:"koricord-a5f4e",
storageBucket:"koricord-a5f4e.appspot.com",
messagingSenderId:"228519016518",
appId:"1:228519016518:web:9062449c2b5135ee36b247"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let messages = [];
let unreadCount = 0;
let isTabFocused = true;

// Escuchar enfoque de la pestaña para limpiar notificaciones rojas
window.addEventListener('focus', () => {
  isTabFocused = true;
  unreadCount = 0;
  document.title = "KoriCord";
});
window.addEventListener('blur', () => {
  isTabFocused = false;
});

// Generador de sonido sintético para imitar la notificación de Discord sin archivos .mp3
function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    // Notas de notificación rápidas y agudas
    osc.frequency.setValueAtTime(550, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) { console.log("Sonido bloqueado por interacción del navegador"); }
}

function handleNewMessageNotification() {
  if (!isTabFocused) {
    unreadCount++;
    document.title = `(${unreadCount}) 🔴 KoriCord`;
    playNotificationSound();
  }
}

window.check = () => {
const val = document.getElementById("code").value;
if(val === "soykori"){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="flex";
}else{
document.getElementById("err").innerText="Esto es solo para Kori. Intenta otra vez.";
}
};

function render(){
const box = document.getElementById("messages");
box.innerHTML = "";
messages.sort((a,b)=>a.timestamp-b.timestamp);

for(const m of messages){
const div = document.createElement("div");
div.className="msg";

const avatarHtml = m.avatar 
    ? `<img src="${m.avatar}" alt="">`
    : (m.nickname || "K")[0];

let attachmentHtml = "";
if(m.attachments && m.attachments.length > 0){
  for(const att of m.attachments){
    if(att.type === "image"){
      attachmentHtml += `<div class="media-attachment"><img src="${att.url}" alt="imagen"></div>`;
    } else if(att.type === "video"){
      attachmentHtml += `<div class="media-attachment"><video src="${att.url}" controls></video></div>`;
    }
  }
}

div.innerHTML = `
<div class="avatar-container">
  <div class="avatar">${avatarHtml}</div>
</div>
<div class="msg-content">
  <div class="top">
    <span class="name">${m.nickname || m.username}</span>
    <span class="sub-user">@${m.username || 'kori'}</span>
    <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
  </div>
  <div class="text">${m.text || ""}</div>
  ${attachmentHtml}
</div>`;
box.appendChild(div);
}
box.scrollTop = box.scrollHeight;
}

// Mensajes de Discord
onChildAdded(ref(db,"discordMessages"), snap=>{
messages.push(snap.val());
render();
handleNewMessageNotification();
});

// Mensajes de la Web (Kori)
onChildAdded(ref(db,"webMessages"), snap=>{
const data = snap.val();
messages.push({
  text: data.text,
  nickname: "Kori",
  username: "soykori",
  timestamp: data.time
});
render();
});

// Escuchar lista de usuarios conectados + actividades + estados de color
onValue(ref(db, "usersStatus"), snap => {
  const container = document.getElementById("members-container");
  container.innerHTML = "";
  const users = snap.val();
  if(!users) return;

  const sortedUsers = Object.values(users).sort((a,b) => (b.status !== "offline") - (a.status !== "offline"));

  for(const u of sortedUsers){
    const card = document.createElement("div");
    card.className = "member-card";
    
    const userAvatar = u.avatar ? `<img src="${u.avatar}">` : u.nickname[0];
    
    // Configurar clase según estado de Discord (online, idle, dnd, offline)
    let statusClass = "status-offline";
    if(u.status === "online") statusClass = "status-online";
    if(u.status === "idle") statusClass = "status-idle";
    if(u.status === "dnd") statusClass = "status-dnd";

    let activityHtml = "";
    if(u.status !== "offline" && u.activity) {
      activityHtml = `<span class="member-activity">${u.activity}</span>`;
    }

    card.innerHTML = `
      <div class="avatar-container">
        <div class="avatar">${userAvatar}</div>
        <div class="status-dot ${statusClass}"></div>
      </div>
      <div class="user-info">
        <span class="member-nick">${u.nickname}</span>
        <span class="member-user">@${u.username}</span>
        ${activityHtml}
      </div>
    `;
    container.appendChild(card);
  }
});

// Escuchar typing dinámico
onValue(ref(db, "typing/discord"), snap => {
  const typingBox = document.getElementById("typing");
  const data = snap.val();
  
  if (data && data.username && (Date.now() - data.time < 6000)) {
    typingBox.innerText = `@${data.username} está escribiendo...`;
  } else {
    typingBox.innerText = "";
  }
});

window.sendMessage = async function(){
const text = document.getElementById("msg").value;
if(!text.trim()) return;

await push(ref(db,"webMessages"),{
text: text,
time:Date.now()
});

document.getElementById("msg").value="";
};

document.getElementById("msg").addEventListener("keydown",(e)=>{
if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
