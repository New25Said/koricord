
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KoriCord</title>

<style>
body{margin:0;font-family:Arial;background:#313338;color:white;height:100vh;}
#login{position:fixed;inset:0;background:#1e1f22;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
input,button{padding:10px;border-radius:6px;border:none;}
button{background:#5865f2;color:white;cursor:pointer;}
.chat{display:none;height:100vh;flex-direction:column;}
.messages{flex:1;overflow-y:auto;padding:12px;}
.msg{display:flex;gap:10px;padding:8px;}
.avatar{width:38px;height:38px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;}
.text{color:#dcddde;}
.top{display:flex;gap:8px;}
.name{font-weight:bold;}
.time{font-size:11px;color:#aaa;}
</style>
</head>

<body>

<div id="login">
<h2>¿Eres Kori?</h2>
<input id="code" placeholder="escribe: soykori">
<button onclick="check()">Entrar</button>
<p id="err"></p>
</div>

<div class="chat" id="chat">
<div id="messages" class="messages"></div>
<input id="msg" placeholder="mensaje..." />
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyARq5j8Kf9p4SYj4sj3167BjVD-Q4KczQE",
authDomain:"koricord-a5f4e.firebaseapp.com",
databaseURL:"https://koricord-a5f4e-default-rtdb.firebaseio.com",
projectId:"koricord-a5f4e",
storageBucket:"koricord-a5f4e.appspot.com",
messagingSenderId:"228519016518",
appId:"1:228519016518:web:9062449c2b5135ee36b247"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let messages = [];

window.check = () => {
const val = document.getElementById("code").value;
if(val === "soykori"){
document.getElementById("login").style.display="none";
document.getElementById("chat").style.display="flex";
}else{
document.getElementById("err").innerText="Esto es solo para Kori. Intenta otra vez.";
}
};

function render(){
const box = document.getElementById("messages");
box.innerHTML = "";
messages.sort((a,b)=>a.timestamp-b.timestamp);

for(const m of messages){
const div = document.createElement("div");
div.className="msg";

div.innerHTML = `
<div class="avatar">${(m.nickname||"U")[0]}</div>
<div>
<div class="top">
<span class="name">${m.nickname||m.username}</span>
<span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
</div>
<div class="text">${m.text}</div>
</div>`;
box.appendChild(div);
}
}

onChildAdded(ref(db,"discordMessages"), snap=>{
messages.push(snap.val());
render();
});

onChildAdded(ref(db,"webMessages"), snap=>{
messages.push({...snap.val(), nickname:"Kori", timestamp:snap.val().time});
render();
});

window.sendMessage = async function(){
const text = document.getElementById("msg").value;
if(!text) return;

await push(ref(db,"webMessages"),{
text,
time:Date.now()
});

document.getElementById("msg").value="";
};

document.getElementById("msg").addEventListener("keydown",(e)=>{
if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
