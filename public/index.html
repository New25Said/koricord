<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoriCord Futurist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🔐 PANTALLA DE LOGIN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h3>¿Eres Kori?</h3>
      <input id="loginInput" type="password" placeholder="Escribe la clave secreta...">
      <button onclick="checkLogin()">Entrar</button>
      <div id="errorMsg" class="error-msg">Esto es solo para kori, intenta otra vez</div>
    </div>
  </div>

  <!-- 🏢 INTERFAZ PRINCIPAL -->
  <div class="app-container">
    
    <!-- Barra de Servidores Múltiples -->
    <div class="guilds-sidebar" id="guildsSidebar">
      <!-- Los servidores se inyectan dinámicamente aquí -->
    </div>

    <!-- Canales del Servidor Seleccionado -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2 id="serverTitle">KoriCord</h2>
        <div class="sub">2PyM 🌐</div>
      </div>
      <div class="channels-list" id="channelsList"></div>
    </div>

    <!-- Chat Principal -->
    <div class="chat">
      <div class="chat-header">
        <div class="header-left">
          <span class="hashtag">#</span>
          <span id="currentChannelName">selecciona-canal</span>
        </div>
        <button class="toggle-members-btn" onclick="toggleMembersList()">👥 Miembros</button>
      </div>
      
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing-indicator"></div>
      
      <div class="input">
        <input id="msg" placeholder="Escribe a Discord...">
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

    <!-- Lista de Miembros -->
    <div class="members-sidebar" id="membersSidebar">
      <div class="members-title">MIEMBROS</div>
      <div class="members-list" id="membersList"></div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
