<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KoriCord - Full</title>
<style>
/* CSS INTEGRADO */
*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:'Helvetica Neue',Arial,sans-serif;background:#111214;color:#dbdee1;height:100vh;overflow:hidden}
#login{position:fixed;inset:0;background:#1e1f22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:999}
input,button{padding:12px;border-radius:4px;border:none;outline:none}
#app{display:none;height:100vh;width:100vw;display:flex}
.guilds-sidebar{width:72px;background:#1e1f22;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.guild-icon{width:48px;height:48px;border-radius:50%;background:#313338;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:0.2s}
.guild-icon:hover,.guild-icon.active{border-radius:16px;background:#5865f2;color:white}
.channels-sidebar{width:240px;background:#2b2d31;display:flex;flex-direction:column}
.channel-btn{padding:8px;margin:2px 8px;border-radius:4px;cursor:pointer;color:#949ba4}
.channel-btn:hover{background:#35373c}
.channel-btn.active{background:#404249;color:white}
.chat-area{flex:1;display:flex;flex-direction:column;background:#313338}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:16px}
.avatar{width:40px;height:40px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;font-weight:bold}
.member-list{width:240px;background:#2b2d31;padding:16px}
.member-card{display:flex;align-items:center;gap:10px;padding:6px;cursor:pointer}
.input-box{padding:16px;background:#313338}
.input-box input{width:100%;padding:12px;border-radius:8px;background:#383a40;border:none;color:white}
</style>
</head>
<body>
<div id="login"><h2>KoriCord Access</h2><input id="code" type="password"><button id="loginBtn">Entrar</button></div>
<div class="app-container" id="app">
    <div class="guilds-sidebar"><div class="guild-icon" id="dmServerBtn">DM</div><div id="guildsContainer"></div></div>
    <div class="channels-sidebar"><div id="channels-container"></div></div>
    <div class="chat-area"><div id="messages" class="messages"></div><div class="input-box"><input id="msg" placeholder="Mensaje..."></div></div>
    <div class="member-list" id="sidebarRightColumn"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
const db = getDatabase(initializeApp({apiKey:"AIzaSyARq5j8Kf9p4SYj4sj3167BjVD-Q4KczQE",databaseURL:"https://koricord-a5f4e-default-rtdb.firebaseio.com",projectId:"koricord-a5f4e"}));
document.getElementById("loginBtn").onclick = () => { if(document.getElementById("code").value==="soykori"){ document.getElementById("login").style.display="none"; document.getElementById("app").style.display="flex"; }};
const msgInput = document.getElementById("msg");
msgInput.onkeydown = (e) => { if(e.key==="Enter" && msgInput.value.trim()){ push(ref(db, "webMessages"), {text: msgInput.value, time: Date.now(), channelId: "general"}); msgInput.value=""; }};
onChildAdded(ref(db, "discordMessages"), (snap) => {
    const data = snap.val(); const div = document.createElement("div"); div.className="msg";
    div.innerHTML = `<div class="avatar">${(data.nickname||"K")[0]}</div><div class="content"><b>${data.nickname}</b><br>${data.text}</div>`;
    document.getElementById("messages").appendChild(div);
});
</script>
</body>
</html>
