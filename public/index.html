<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KoriCord</title>

<style>
body{margin:0;font-family:Arial;background:#313338;color:white;height:100vh;display:flex}
#login{position:fixed;inset:0;background:#1e1f22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10}
input,button{padding:10px;border:none;border-radius:6px}
input{background:#2b2d31;color:white}
button{background:#5865f2;color:white;cursor:pointer}
.sidebar{width:240px;background:#2b2d31;padding:12px}
.chat{flex:1;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#5865f2;display:flex;align-items:center;justify-content:center}
.content{display:flex;flex-direction:column}
.top{display:flex;gap:8px}
.name{font-weight:bold}
.time{font-size:11px;color:#aaa}
.text{color:#ddd}
#typing{font-size:12px;color:#aaa;padding-left:16px;height:18px}
</style>
</head>

<body>

<div id="login">
<h2>¿Eres Kori?</h2>
<input id="pass" placeholder="contraseña">
<button onclick="login()">Entrar</button>
<p id="err"></p>
</div>

<div class="sidebar">
<h2>KoriCord</h2>
<div>2PyM</div>
</div>

<div class="chat">
<div id="messages" class="messages"></div>
<div id="typing"></div>

<div style="display:flex;gap:10px;padding:12px;background:#2b2d31">
<input id="msg" placeholder="escribe...">
<button onclick="send()">Enviar</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
getDatabase,
ref,
push,
onChildAdded,
set,
remove,
onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🔐 SEND */
window.sendMessage = async function () {
const text = document.getElementById("msg").value;
if (!text) return;

await push(ref(db, "messages"), {
source: "web",
sender: "Kori",
text,
timestamp: Date.now()
});

document.getElementById("msg").value = "";
};

/* 🧠 UNA SOLA LISTA (FIX DESORDEN) */
const messagesList = [];

function render() {
const box = document.getElementById("messages");
box.innerHTML = "";

messagesList
.sort((a, b) => a.timestamp - b.timestamp)
.forEach(data => {

const div = document.createElement("div");
div.className = "msg";

const time = new Date(data.timestamp)
.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

div.innerHTML = `
${
data.avatar
? `<img class="avatar" src="${data.avatar}">`
: `<div class="avatar">${(data.sender || "?")[0]}</div>`
}

<div class="content">
<div class="top">
<span class="name">${data.sender}</span>
<span class="time">${time}</span>
</div>
<div class="text">${data.text}</div>
</div>
`;

box.appendChild(div);
});
}

/* 🔥 LOAD MESSAGES */
onChildAdded(ref(db, "messages"), (snap) => {
messagesList.push(snap.val());
render();
});

/* ✍️ TYPING REAL (KORI + WEB) */
let typingTimeout;

document.getElementById("msg").addEventListener("input", () => {

set(ref(db, "typing/web"), {
name: "Web",
time: Date.now()
});

clearTimeout(typingTimeout);

typingTimeout = setTimeout(() => {
remove(ref(db, "typing/web"));
}, 1000);
});

/* 👀 SHOW TYPING */
onValue(ref(db, "typing"), (snap) => {
const data = snap.val();

if (!data) {
document.getElementById("typing").innerText = "";
return;
}

const users = Object.values(data);
document.getElementById("typing").innerText =
users.map(u => `${u.name} está escribiendo...`).join(", ");
});

/* ENTER */
document.getElementById("msg").addEventListener("keydown", (e) => {
if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
