<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KoriCord</title>
  <style>
    /* Estilos Base Estilo Discord Dark */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'GG Sans', 'Helvetica Neue', Arial, sans-serif; background: #111214; color: #dbdee1; height: 100vh; overflow: hidden; }
    
    /* Login Pantalla */
    #login { position: fixed; inset: 0; background: #1e1f22; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 200; }
    #login h2 { color: #f2f3f5; font-size: 24px; margin-bottom: 8px; }
    input, button { padding: 12px; border-radius: 4px; border: none; outline: none; font-size: 14px; }
    input { background: #1e1f22; color: #dbdee1; border: 1px solid #111214; width: 240px; }
    button { background: #5865f2; color: white; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    button:hover { background: #4752c4; }

    /* Contenedor Principal */
    .app-container { display: none; height: 100vh; width: 100vw; }

    /* Columna 1: Servidores */
    .guilds-sidebar { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; flex-shrink: 0; user-select: none; }
    .guild-icon { width: 48px; height: 48px; border-radius: 50%; background: #2b2d31; color: #dbdee1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; overflow: relative; position: relative; }
    .guild-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: border-radius 0.2s; }
    .guild-icon:hover, .guild-icon.active { border-radius: 16px; background: #5865f2; color: white; }
    .guild-icon:hover img, .guild-icon.active img { border-radius: 16px; }
    .guild-separator { width: 32px; height: 2px; background: #35373c; margin: 4px 0; border-radius: 1px; }
    .dm-icon-svg { width: 26px; height: 26px; fill: currentColor; }
    .guild-badge { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #f23f43; border-radius: 50%; border: 2px solid #1e1f22; display: none; }
    .guild-icon.unread .guild-badge { display: block; }

    /* Columna 2: Canales y Mensajes Directos */
    .channels-sidebar { width: 240px; background: #2b2d31; display: flex; flex-direction: column; padding: 12px 8px; gap: 2px; flex-shrink: 0; }
    .sidebar-title { font-size: 12px; font-weight: 700; color: #949ba4; text-transform: uppercase; letter-spacing: 0.25px; padding: 8px; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-bottom: 1px solid #1f2023; }
    .channel-list-scroller { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    
    /* Botones de Canal/DM estilo Discord */
    .channel-btn { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 4px; color: #949ba4; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.15s, color 0.15s; }
    .channel-btn:hover { background: #35373c; color: #dbdee1; }
    .channel-btn.active { background: #404249; color: white; }
    .channel-btn.is-channel::before { content: "#"; font-size: 18px; color: #80848e; margin-right: 2px; }
    .channel-badge { width: 8px; height: 8px; background: white; border-radius: 50%; margin-left: auto; display: none; }
    .channel-btn.unread .channel-badge { display: block; }
    .channel-btn.unread { color: #f2f3f5; font-weight: 600; }

    /* Columna 3: Área de Chat */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #313338; min-width: 0; position: relative; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    
    /* Marcadores de Estado / Vistas Vacías */
    .dm-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #949ba4; text-align: center; background: #313338; }
    .dm-placeholder h3 { color: #f2f3f5; font-size: 18px; margin: 0 0 4px 0; }
    .dm-placeholder p { font-size: 14px; margin: 0; }

    /* Mensajes */
    .msg { display: flex; gap: 16px; align-items: flex-start; }
    .msg:hover { background: rgba(0, 0, 0, 0.05); }
    .avatar-container { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .msg-content { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .top { display: flex; align-items: baseline; gap: 8px; }
    .name { font-weight: 500; color: #f2f3f5; font-size: 15px; cursor: pointer; }
    .name:hover { underline: text-decoration; }
    .sub-user { font-size: 11px; color: #949ba4; display: none; } /* Oculto por defecto para limpiar UI */
    .time { font-size: 11px; color: #949ba4; }
    .text { color: #dbdee1; font-size: 15px; word-break: break-word; line-height: 1.375; margin-top: 2px; }
    .text code { background: #1e1f22; padding: 2px 4px; border-radius: 4px; font-family: Consolas, monospace; font-size: 13px; color: #e0c89a; }
    
    /* Adjuntos Multimedia */
    .media-attachment { margin-top: 8px; max-width: 100%; }
    .media-attachment img, .media-attachment video { max-width: 400px; max-height: 300px; border-radius: 4px; object-fit: contain; }

    /* Cuadro de Texto Inferior */
    .input-box { padding: 0 16px 24px 16px; background: #313338; position: relative; }
    .input-box input { width: 100%; background: #383a40; color: #dbdee1; padding: 11px 16px; font-size: 15px; border-radius: 8px; border: none; box-sizing: border-box; }
    .typing-indicator { position: absolute; top: -18px; left: 24px; font-size: 12px; color: #b5bac1; height: 14px; }

    /* Lunas de Estado en Avatares */
    .status-dot { position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #2b2d31; }
    .status-online { background: #23a55a; }
    .status-idle { background: #f0b232; }
    .status-dnd { background: #f23f43; }
    .status-offline { background: #80848e; }

    /* Columna 4: Derecha Dinámica (Miembros o Info de Perfil nativa) */
    .member-list { width: 240px; background: #2b2d31; display: flex; flex-direction: column; border-left: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; overflow-y: auto; }
    .member-title { font-size: 12px; font-weight: 700; color: #949ba4; text-transform: uppercase; letter-spacing: 0.25px; padding: 20px 16px 8px 16px; }
    .member-card { display: flex; align-items: center; gap: 12px; padding: 6px 16px; border-radius: 4px; cursor: pointer; margin: 1px 8px; transition: background 0.1s; }
    .member-card:hover { background: #35373c; }
    .user-info-sidebar { display: flex; flex-direction: column; min-width: 0; }
    .member-nick { font-weight: 500; font-size: 14px; color: #949ba4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-card:hover .member-nick { color: #f2f3f5; }
    .member-user { font-size: 12px; color: #949ba4; display: none; }
    .member-activity { font-size: 12px; color: #b5bac1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Estilo Premium para Tarjeta de Usuario en MD (Lado Derecho) */
    .sidebar-dm-profile { display: flex; flex-direction: column; background: #18191c; height: 100%; }
    .side-banner { height: 60px; background: #5865f2; position: relative; flex-shrink: 0; }
    .side-avatar-wrapper { position: absolute; bottom: -28px; left: 12px; }
    .side-avatar { width: 64px; height: 64px; border-radius: 50%; border: 6px solid #18191c; background: #5865f2; overflow: hidden; }
    .side-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .side-profile-header { padding: 36px 16px 12px 16px; border-bottom: 1px solid #232428; }
    .side-nick { font-size: 18px; font-weight: 700; color: white; display: flex; align-items: center; gap: 6px; }
    .side-app-badge { background: #5865f2; color: white; font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
    .side-user { font-size: 13px; color: #b5bac1; margin-top: 2px; }
    .side-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
    .side-sub-title { font-size: 11px; font-weight: 700; color: #949ba4; text-transform: uppercase; letter-spacing: 0.25px; margin-bottom: 4px; }
    .side-box { background: #232428; padding: 10px; border-radius: 4px; color: #dbdee1; font-size: 13px; line-height: 1.4; word-break: break-word; }

    /* Modal de Perfil Limpio Completo */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 250; align-items: center; justify-content: center; }
    .profile-modal { width: 300px; background: #18191c; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.6); }
    .profile-banner { height: 60px; background: #5865f2; }
    .profile-header { padding: 0 16px 16px 16px; position: relative; border-bottom: 1px solid #232428; }
    .profile-modal-avatar { width: 72px; height: 72px; border-radius: 50%; border: 6px solid #18191c; background: #5865f2; overflow: hidden; position: absolute; top: -36px; left: 16px; }
    .profile-modal-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-names { margin-top: 44px; }
    .profile-nick { font-size: 18px; font-weight: 700; color: white; }
    .profile-user { font-size: 13px; color: #b5bac1; margin-top: 2px; }
    .profile-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
    .profile-section-title { font-size: 11px; font-weight: 700; color: #949ba4; text-transform: uppercase; }
    .profile-roles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .role-badge { background: #2b2d31; color: #dbdee1; padding: 4px 8px; border-radius: 4px; font-size: 12px; border: 1px solid #35373c; }
  </style>
</head>
<body>

<div id="login">
  <h2>¿Eres Kori?</h2>
  <input id="code" type="password" placeholder="escribe: soykori">
  <button onclick="check()">Entrar</button>
  <p id="err" style="color:#f23f43; font-size:14px;"></p>
</div>

<div class="app-container" id="app">
  <div class="guilds-sidebar">
    <div class="guild-icon active" id="dmServerBtn" title="Mensajes Directos" onclick="selectDMMode()">
      <svg class="dm-icon-svg" viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.43-5c.56-.41,1.11-.84,1.64-1.28A75.48,75.48,0,0,0,100,79.24c.53.44,1.08.87,1.64,1.28a68.43,68.43,0,0,1-10.43,5A77.7,77.7,0,0,0,97.83,96.36a105.73,105.73,0,0,0,31-18.83C130,50.12,123.83,27.23,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/></svg>
      <div class="guild-badge"></div>
    </div>
    <div class="guild-separator"></div>
    <div id="guildsContainer" style="display:contents;"></div>
  </div>

  <div class="channels-sidebar">
    <div class="sidebar-title" id="currentGuildName">Mensajes Directos</div>
    <div class="channel-list-scroller" id="channels-container"></div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="dm-placeholder" id="placeholderView">
      <h3>Activo ahora</h3>
      <p>Por ahora está todo tranquilo... Elige una conversación de la lista.</p>
    </div>
    <div id="mainChatContent" style="display:none; flex:1; flex-direction:column;">
      <div id="messages" class="messages"></div>
      <div class="input-box">
        <div id="typing" class="typing-indicator"></div>
        <input id="msg" placeholder="Enviar mensaje..." />
      </div>
    </div>
  </div>

  <div class="member-list" id="sidebarRightColumn"></div>
</div>

<div class="modal-overlay" id="profileModal" onclick="closeProfile()">
  <div class="profile-modal" onclick="event.stopPropagation()">
    <div class="profile-banner"></div>
    <div class="profile-header">
      <div class="profile-modal-avatar" id="modalAvatar"></div>
      <div class="profile-names">
        <div class="profile-nick" id="modalNick">-</div>
        <div class="profile-user" id="modalUser">@unknown</div>
      </div>
    </div>
    <div class="profile-body">
      <div>
        <div class="profile-section-title">Estado del Usuario</div>
        <div style="color:#dbdee1; margin-top:4px;" id="modalStatusText">Desconectado</div>
      </div>
      <div>
        <div class="profile-section-title">Actividad Actual</div>
        <div style="color:#dbdee1; margin-top:4px;" id="modalActivity">Ninguna</div>
      </div>
      <div>
        <div class="profile-section-title">Miembro Desde</div>
        <div style="color:#dbdee1; margin-top:4px;" id="modalJoined">-</div>
      </div>
      <div>
        <div class="profile-section-title">Roles</div>
        <div class="profile-roles" id="modalRoles">Ninguno</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, onValue, set } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARq5j8Kf9p4SYj4sj3167BjVD-Q4KczQE",
    authDomain: "koricord-a5f4e.firebaseapp.com",
    databaseURL: "https://koricord-a5f4e-default-rtdb.firebaseio.com",
    projectId: "koricord-a5f4e",
    storageBucket: "koricord-a5f4e.appspot.com",
    messagingSenderId: "228519016518",
    appId: "1:228519016518:web:9062449c2b5135ee36b247"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let messages = [];
  let cacheUsers = {};
  let isDMMode = true; 
  let currentGuildId = "DM"; 
  let currentChannelId = "";

  function escapeHTML(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
  function parseMarkdown(text) {
    return escapeHTML(text)
      .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__([\s\S]+?)__/g, '<u>$1</u>')
      .replace(/\*([\s\S]+?)\*/g, '<em>$1</em>')
      .replace(/~~([\s\S]+?)~~/g, '<del>$1</del>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  window.check = () => {
    const val = document.getElementById("code").value;
    if(val === "soykori"){
      document.getElementById("login").style.display="none";
      document.getElementById("app").style.display="flex";
      selectDMMode();
    }else{
      document.getElementById("err").innerText="Código incorrecto.";
    }
  };

  // Renderizador unificado de Mensajes
  function renderMessages(){
    const box = document.getElementById("messages");
    box.innerHTML = "";
    document.getElementById("typing").innerText = "";

    if(!currentChannelId) {
      document.getElementById("placeholderView").style.display = "flex";
      document.getElementById("mainChatContent").style.display = "none";
      renderRightSidebar();
      return;
    }
    
    document.getElementById("placeholderView").style.display = "none";
    document.getElementById("mainChatContent").style.display = "flex";
    
    const filtered = messages.filter(m => m.channelId === currentChannelId);
    filtered.sort((a,b) => a.timestamp - b.timestamp);

    for(const m of filtered){
      const div = document.createElement("div"); div.className="msg";
      const avatarHtml = m.avatar ? `<img src="${m.avatar}">` : (m.nickname || "K")[0];
      let attachmentHtml = "";
      if(m.attachments){
        for(const att of m.attachments){
          if(att.type === "image") attachmentHtml += `<div class="media-attachment"><img src="${att.url}"></div>`;
          if(att.type === "video") attachmentHtml += `<div class="media-attachment"><video src="${att.url}" controls></video></div>`;
        }
      }
      div.innerHTML = `
        <div class="avatar-container">
          <div class="avatar">${avatarHtml}</div>
        </div>
        <div class="msg-content">
          <div class="top">
            <span class="name" onclick="openProfileFromMessage('${m.username}')">${m.nickname || m.username}</span>
            <span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span>
          </div>
          <div class="text">${parseMarkdown(m.text)}</div>
          ${attachmentHtml}
        </div>`;
      box.appendChild(div);
    }
    box.scrollTop = box.scrollHeight;
    renderRightSidebar();
  }

  // Carga e intercambio dinámico de Servidor / DM libre de fantasmas
  window.selectDMMode = () => {
    isDMMode = true; currentGuildId = "DM"; currentChannelId = "";
    document.querySelectorAll('.guild-icon').forEach(i => i.classList.remove('active'));
    document.getElementById("dmServerBtn").classList.add('active');
    
    // Limpieza forzada inmediata preventiva
    document.getElementById("channels-container").innerHTML = "";
    document.getElementById("sidebarRightColumn").innerHTML = "";
    messages = []; 
    renderMessages();

    loadChannelsAndMembers();
  };

  // Carga Estructurada Reactiva
  function loadChannelsAndMembers() {
    const channelContainer = document.getElementById("channels-container");
    channelContainer.innerHTML = "";

    if (isDMMode) {
      document.getElementById("currentGuildName").innerText = "Mensajes Directos";
      
      onValue(ref(db, "dmChannels"), snap => {
        if(!isDMMode) return; // Salvaguarda si cambió rápido de servidor
        channelContainer.innerHTML = ""; 
        const dms = snap.val(); 
        if(!dms) { cacheUsers = {}; renderRightSidebar(); return; }
        
        cacheUsers = dms;
        Object.values(dms).forEach(dm => {
          const btn = document.createElement("div");
          btn.className = `channel-btn ${dm.id === currentChannelId ? 'active' : ''}`;
          let statusClass = "status-" + (dm.status || "offline");
          btn.innerHTML = `
            <div class="avatar-container" style="width:32px; height:32px;">
              <div class="avatar" style="width:32px; height:32px; font-size:12px;">
                ${dm.avatar ? `<img src="${dm.avatar}">` : dm.name[0]}
              </div>
              <div class="status-dot ${statusClass}" style="width:10px; height:10px; border:2px solid #2b2d31;"></div>
            </div>
            <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; font-weight:500;">${dm.name}</div>
          `;
          btn.onclick = () => {
            currentChannelId = dm.id;
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMessages();
          };
          channelContainer.appendChild(btn);
        });
        renderRightSidebar();
      });
    } else {
      // MODO SERVIDORES NORMAL
      onValue(ref(db, `guilds/${currentGuildId}/name`), snap => { if(snap.val()) document.getElementById("currentGuildName").innerText = snap.val(); });
      
      onValue(ref(db, `channels/${currentGuildId}`), snap => {
        if(isDMMode) return;
        channelContainer.innerHTML = ""; 
        const channels = snap.val(); 
        if(!channels) return;
        
        let firstChannel = true;
        Object.values(channels).forEach(ch => {
          const btn = document.createElement("div");
          btn.className = `channel-btn is-channel ${ch.id === currentChannelId ? 'active' : ''}`;
          btn.innerText = ch.name;
          btn.onclick = () => {
            currentChannelId = ch.id;
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMessages();
          };
          channelContainer.appendChild(btn);
          
          if(firstChannel && !currentChannelId) {
            currentChannelId = ch.id;
            btn.classList.add('active');
            renderMessages();
            firstChannel = false;
          }
        });
      });

      onValue(ref(db, `usersStatus/${currentGuildId}`), snap => {
        if(isDMMode) return;
        cacheUsers = snap.val() || {};
        renderRightSidebar();
      });
    }
  }

  // Render de la Columna Derecha de Información Limpia
  function renderRightSidebar() {
    const sidebar = document.getElementById("sidebarRightColumn");
    sidebar.innerHTML = "";

    if (isDMMode) {
      if (!currentChannelId || !cacheUsers[currentChannelId]) {
        sidebar.innerHTML = `<div class="member-title">Lista de MDs</div><div style="padding:16px; color:#949ba4; font-size:13px;">Selecciona una conversación privada para ver su información de perfil.</div>`;
        return;
      }
      
      const activeUser = cacheUsers[currentChannelId];
      let statusClass = "status-" + (activeUser.status || "offline");
      let statusMap = { online: "En línea", idle: "Ausente", dnd: "No molestar", offline: "Desconectado" };
      let friendlyStatus = statusMap[activeUser.status || "offline"];
      let bioText = activeUser.bio || "Este usuario no ha definido ninguna descripción en su perfil de KoriCord todavía.";
      let creationDate = activeUser.joinedAt ? new Date(activeUser.joinedAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : "6 jun 2026";

      sidebar.innerHTML = `
        <div class="sidebar-dm-profile">
          <div class="side-banner">
            <div class="side-avatar-wrapper">
              <div class="side-avatar">
                ${activeUser.avatar ? `<img src="${activeUser.avatar}">` : activeUser.name[0]}
              </div>
              <div class="status-dot ${statusClass}" style="width:16px; height:16px; border:4px solid #18191c; bottom:2px; right:2px;"></div>
            </div>
          </div>
          <div class="side-profile-header">
            <div class="side-nick">${activeUser.name} <span class="side-app-badge">BOT</span></div>
            <div class="side-user">@${activeUser.username || 'usuario'}</div>
          </div>
          <div class="side-body">
            <div>
              <div class="side-sub-title">Estado</div>
              <div style="font-size:13px; color:#dbdee1; margin-bottom:12px;">${friendlyStatus}</div>
            </div>
            <div>
              <div class="side-sub-title">Biografía</div>
              <div class="side-box">${bioText}</div>
            </div>
            <div>
              <div class="side-sub-title">Miembro Desde</div>
              <div style="color:#dbdee1; font-size:13px;">${creationDate}</div>
            </div>
          </div>
        </div>`;
    } else {
      // MODO SERVIDORES: Miembros Reales Activos
      const title = document.createElement("div"); title.className = "member-title"; title.innerText = "Miembros del Servidor";
      sidebar.appendChild(title);

      Object.values(cacheUsers).forEach(u => {
        const card = document.createElement("div"); card.className = "member-card";
        card.onclick = () => openProfile(u.uid);
        let statusClass = "status-" + (u.status || "offline");
        let activityHtml = u.activity ? `<span class="member-activity">${u.activity}</span>` : "";
        
        card.innerHTML = `
          <div class="avatar-container" style="width:32px; height:32px;">
            <div class="avatar" style="width:32px; height:32px; font-size:14px;">
              ${u.avatar ? `<img src="${u.avatar}">` : u.nickname[0]}
            </div>
            <div class="status-dot ${statusClass}" style="width:10px; height:10px; border:2px solid #2b2d31;"></div>
          </div>
          <div class="user-info-sidebar">
            <span class="member-nick">${u.nickname}</span>
            ${activityHtml}
          </div>
        `;
        sidebar.appendChild(card);
      });
    }
  }

  // Escuchadores Globales Inalterados de Mensajería Global
  onChildAdded(ref(db, "discordMessages"), snap => {
    messages.push(snap.val());
    renderMessages();
  });

  onChildAdded(ref(db, "webMessages"), snap => {
    const data = snap.val();
    messages.push({ text: data.text, nickname: "Kori", username: "soykori", timestamp: data.time, channelId: data.channelId });
    renderMessages();
  });

  // Modal de Perfil Avanzado y no intrusivo
  window.openProfile = (uid) => {
    const u = cacheUsers[uid]; if(!u) return;
    let statusMap = { online: "En línea 🟢", idle: "Ausente 🌙", dnd: "No molestar ⛔", offline: "Desconectado 👤" };
    
    document.getElementById("modalAvatar").innerHTML = u.avatar ? `<img src="${u.avatar}">` : u.nickname[0];
    document.getElementById("modalNick").innerText = u.nickname || u.name;
    document.getElementById("modalUser").innerText = "@" + (u.username || "usuario");
    document.getElementById("modalStatusText").innerText = statusMap[u.status || "offline"];
    document.getElementById("modalActivity").innerText = u.activity || "Ninguna";
    document.getElementById("modalJoined").innerText = u.joinedAt ? new Date(u.joinedAt).toLocaleDateString() : "Desconocido";
    
    const rolesBox = document.getElementById("modalRoles"); rolesBox.innerHTML = "";
    if(u.roles && u.roles.length){ 
      u.roles.forEach(r => { const b = document.createElement("span"); b.className = "role-badge"; b.innerText = r; rolesBox.appendChild(b); }); 
    } else { rolesBox.innerText = "Ninguno"; }
    
    document.getElementById("profileModal").style.display = "flex";
  };

  window.openProfileFromMessage = (username) => {
    const found = Object.values(cacheUsers).find(u => u.username === username);
    if(found) openProfile(found.uid || found.id);
  };

  window.closeProfile = () => { document.getElementById("profileModal").style.display = "none"; };

  // Manejo de Escritura limpio e inteligente
  onValue(ref(db, "typing/discord"), snap => {
    const typingBox = document.getElementById("typing"); const data = snap.val();
    if (data && data.channelId === currentChannelId && (Date.now() - data.time < 4000)) { 
      typingBox.innerText = `@${data.username} está escribiendo...`; 
    } else { 
      typingBox.innerText = ""; 
    }
  });

  let typingTimeoutWeb;
  document.getElementById("msg").addEventListener("input", () => {
    set(ref(db, "typing/web"), { username: "soykori", time: Date.now(), channelId: currentChannelId });
    clearTimeout(typingTimeoutWeb);
    typingTimeoutWeb = setTimeout(() => { set(ref(db, "typing/web"), null); }, 3500);
  });

  window.sendMessage = async function(){
    const text = document.getElementById("msg").value; if(!text.trim() || !currentChannelId) return;
    set(ref(db, "typing/web"), null);
    await push(ref(db, "webMessages"), { text: text, time: Date.now(), channelId: currentChannelId });
    document.getElementById("msg").value="";
  };
  document.getElementById("msg").addEventListener("keydown", (e) => { if(e.key === "Enter") sendMessage(); });

  // Lista de Servidores e inicialización limpia
  onValue(ref(db, "guilds"), snap => {
    const container = document.getElementById("guildsContainer"); container.innerHTML = "";
    const guilds = snap.val(); if(!guilds) return;
    Object.values(guilds).forEach(g => {
      const iconBtn = document.createElement("div");
      iconBtn.className = `guild-icon ${(!isDMMode && g.id === currentGuildId) ? 'active' : ''}`;
      iconBtn.title = g.name;
      iconBtn.innerHTML = g.iconUrl ? `<img src="${g.iconUrl}"><div class="guild-badge"></div>` : `${g.name.split(" ").map(w=>w[0]).join("")}<div class="guild-badge"></div>`;
      iconBtn.onclick = () => {
        isDMMode = false; currentGuildId = g.id; currentChannelId = "";
        document.querySelectorAll('.guild-icon').forEach(i => i.classList.remove('active'));
        iconBtn.classList.add('active');
        
        // Limpieza forzada inmediata preventiva antes de pintar el server
        document.getElementById("channels-container").innerHTML = "";
        document.getElementById("sidebarRightColumn").innerHTML = "";
        messages = [];
        renderMessages();
        
        loadChannelsAndMembers();
      };
      container.appendChild(iconBtn);
    });
  });
</script>
</body>
</html>
