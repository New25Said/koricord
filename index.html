<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korcord - Chat Privado</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #313338; color: #dbdee1; display: flex; height: 100vh; }
        #sidebar { width: 200px; background-color: #2b2d31; padding: 20px; box-sizing: border-box; }
        #chat-area { flex: 1; display: flex; flex-direction: column; background-color: #313338; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #383a40; padding: 10px; border-radius: 8px; }
        .user-name { font-weight: bold; color: #5865f2; margin-bottom: 4px; }
        #input-area { padding: 20px; background-color: #313338; display: flex; gap: 10px; }
        input, select { padding: 10px; background: #383a40; border: none; color: white; border-radius: 5px; }
        input[type="text"] { flex: 1; }
        button { padding: 10px 20px; background-color: #5865f2; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #4752c4; }
    </style>
</head>
<body>

    <!-- Barra lateral estilo Discord -->
    <div id="sidebar">
        <h3>Korcord 🟢</h3>
        <p style="font-size: 14px; color: #949ba4;">Miembros:</p>
        <ul style="list-style: none; padding: 0;">
            <li>👤 Said</li>
            <li>👤 Rafa</li>
            <li>👤 Kori</li>
        </ul>
    </div>

    <!-- Zona del Chat -->
    <div id="chat-area">
        <div id="messages"></div>
        
        <div id="input-area">
            <select id="user-select">
                <option value="Said">Said</option>
                <option value="Rafa">Rafa</option>
                <option value="Kori" selected>Kori</option>
            </select>
            <input type="text" id="message-input" placeholder="Enviar mensaje a Korcord...">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <!-- Lógica de Firebase y Discord -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        // Configuración de tu Firebase Korcord
        const firebaseConfig = {
          apiKey: "AIzaSyAd6JPLTRDzht6k-bL5WqSRaUAtLbsOvrk",
          authDomain: "korcord.firebaseapp.com",
          databaseURL: "https://korcord-default-rtdb.firebaseio.com",
          projectId: "korcord",
          storageBucket: "korcord.firebasestorage.app",
          messagingSenderId: "1099244343098",
          appId: "1:1099244343098:web:45927a34d72c0e3fc44a03",
          measurementId: "G-MN373K4JXH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        const sendBtn = document.getElementById('send-btn');
        const messageInput = document.getElementById('message-input');
        const userSelect = document.getElementById('user-select');
        const messagesDiv = document.getElementById('messages');

        // URL de tu Webhook Real de Discord
        const webhookURL = "https://discord.com/api/webhooks/1512950343670038548/aNxL0FS4W90t4O7X8qQORA613nAyx2l3VyFKUNmDrI5T8uFbchiz21PAApBx8qWRIBUG";

        // Función para inyectar el mensaje en el Discord Real
        function enviarADiscord(usuario, mensaje) {
            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: usuario,
                    content: mensaje
                })
            }).catch(err => console.error("Error enviando a Discord:", err));
        }

        // Función principal para procesar y mandar el mensaje
        function procesarMensaje() {
            const text = messageInput.value;
            const user = userSelect.value;
            
            if(text.trim() !== "") {
                // 1. Guardar en Firebase (para que se pinte en la web)
                push(messagesRef, {
                    username: user,
                    message: text,
                    timestamp: Date.now()
                });
                
                // 2. Mandar al canal real de Discord
                enviarADiscord(user, text);

                messageInput.value = ""; 
            }
        }

        // Enviar al hacer clic en el botón
        sendBtn.addEventListener('click', procesarMensaje);

        // Enviar también al presionar la tecla "Enter"
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                procesarMensaje();
            }
        });

        // Escuchar Firebase en vivo para pintar los mensajes en la web
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const msgElement = document.createElement('div');
            msgElement.classList.add('message');
            msgElement.innerHTML = `<div class="user-name">${msg.username}</div><div>${msg.message}</div>`;
            messagesDiv.appendChild(msgElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; 
        });
    </script>
</body>
</html>
