<!DOCTYPE html>
<html>
<head>
    <title>KoriCord</title>

    <style>
        body{
            margin:0;
            background:#313338;
            color:white;
            font-family:Arial,sans-serif;
            display:flex;
            height:100vh;
        }

        .sidebar{
            width:220px;
            background:#2b2d31;
            padding:15px;
        }

        .channel{
            padding:8px;
            color:#b5bac1;
            cursor:pointer;
        }

        .channel:hover{
            background:#3f4248;
            border-radius:5px;
        }

        .chat{
            flex:1;
            padding:20px;
        }

        .title{
            font-size:24px;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>KoriCord</h2>

        <div class="channel"># general</div>
        <div class="channel"># memes</div>
        <div class="channel"># random</div>
    </div>

    <div class="chat">
        <div class="title"># general</div>

        <p><b>Said:</b> Hola Kori 👋</p>
        <p><b>Rafa:</b> XD</p>
        <p><b>Kori:</b> Holaaa</p>
    </div>

</body>
</html>
